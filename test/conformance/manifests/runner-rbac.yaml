apiVersion: v1
kind: Namespace
metadata:
  name: flareway-conformance-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: flareway-conformance-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flareway-conformance-runner
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
  - nonResourceURLs:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flareway-conformance-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flareway-conformance-runner
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: flareway-conformance-runner
