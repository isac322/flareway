# This rule is not used by the project flareway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the flareway.bhyoo.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: flareway
    app.kubernetes.io/managed-by: kustomize
  name: accessinfrastructuretarget-editor-role
rules:
- apiGroups:
  - flareway.bhyoo.com
  resources:
  - accessinfrastructuretargets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - flareway.bhyoo.com
  resources:
  - accessinfrastructuretargets/status
  verbs:
  - get
