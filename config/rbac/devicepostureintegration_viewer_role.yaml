# This rule is not used by the project flareway itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to flareway.bhyoo.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: flareway
    app.kubernetes.io/managed-by: kustomize
  name: devicepostureintegration-viewer-role
rules:
- apiGroups:
  - flareway.bhyoo.com
  resources:
  - devicepostureintegrations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - flareway.bhyoo.com
  resources:
  - devicepostureintegrations/status
  verbs:
  - get
