apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessPolicy
metadata:
  name: allow-developers-warp
  namespace: default
spec:
  accountRef:
    name: example-account
  name: allow-developers-warp
  decision: Allow
  include:
  - group:
      groupRef:
        name: developers
  require:
  - devicePosture:
      ruleRef:
        name: warp
  exclude:
  - geo:
      countryCode: KP
  sessionDuration: 720h
  purposeJustification:
    required: true
    prompt: Enter the incident or change ticket for this session.
  approval:
    required: true
    groups:
    - approvalsNeeded: 1
      emailAddresses:
      - access-approvers@example.com
  isolationRequired: false
  connectionRules:
    rdp:
      allowedClipboardLocalToRemoteFormats:
      - Text
      allowedClipboardRemoteToLocalFormats:
      - Text
      - File
  mfaConfig:
    allowedAuthenticators:
    - TOTP
    - SecurityKey
    mfaDisabled: false
    sessionDuration: 8h
  managementPolicy: ObserveOnly
  externalRef:
    policyId: replace-with-existing-allow-policy-id
  deletionPolicy: Orphan
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessPolicy
metadata:
  name: deny-everyone
  namespace: default
spec:
  accountRef:
    name: example-account
  name: deny-everyone
  decision: Deny
  include:
  - everyone: {}
  managementPolicy: ObserveOnly
  externalRef:
    policyId: replace-with-existing-deny-policy-id
  deletionPolicy: Orphan
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessPolicy
metadata:
  name: bypass-public-api
  namespace: default
spec:
  accountRef:
    name: example-account
  name: bypass-public-api
  decision: Bypass
  include:
  - everyone: {}
  managementPolicy: Managed
  deletionPolicy: Orphan
