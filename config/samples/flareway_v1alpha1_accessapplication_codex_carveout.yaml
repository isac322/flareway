apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: codex-lb
  namespace: default
spec:
  gatewayClassName: flareway
  listeners:
  - name: web
    hostname: codex-lb.example.com
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codex-lb
  namespace: default
spec:
  parentRefs:
  - name: codex-lb
  hostnames:
  - codex-lb.example.com
  rules:
  - name: public-v1
    matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: codex-lb
      port: 2455
  - name: public-codex
    matches:
    - path:
        type: PathPrefix
        value: /backend-api/codex
    backendRefs:
    - name: codex-lb
      port: 2455
  - name: dashboard
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: codex-lb
      port: 2455
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessApplication
metadata:
  name: codex-lb-dashboard
  namespace: default
spec:
  accountRef:
    name: example
  type: SelfHosted
  selfHosted: {}
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: codex-lb
    sectionName: dashboard
  pathScope:
    type: PathPrefix
    value: /
  application:
    name: codex-lb dashboard
    sessionDuration: 720h
    appLauncherVisible: false
    customPageRefs:
    - objectRef:
        name: accesscustompage-sample
  policies:
  - policyRef:
      name: allow-developers-warp
  - policyRef:
      name: deny-everyone
  originJWT:
    mode: Required
  bypass:
    children:
    - hostname: codex-lb.example.com
      path: /v1
      name: codex-lb public v1
      externalRef:
        applicationId: replace-with-existing-bypass-application-id
      adoption:
        mode: AdoptById
        expect:
          name: codex-lb public v1
      deletionPolicy: Orphan
    - hostname: codex-lb.example.com
      path: /backend-api/codex
      name: codex-lb public Codex API
      policyRef:
        policyRef:
          name: bypass-public-api
      deletionPolicy: Delete
  managementPolicy: Managed
  deletionPolicy: Delete
