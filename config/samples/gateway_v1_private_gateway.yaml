apiVersion: v1
kind: Namespace
metadata:
  name: llm-proxy
  labels:
    flareway.bhyoo.com/tenant: llm-proxy
    flareway.bhyoo.com/allow-origin-jwt-disable: "true"
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: CloudflareTunnel
metadata:
  name: cc-lb
  namespace: llm-proxy
spec:
  accountRef:
    name: runbear
  tunnel:
    name: flareway-runbear-cc-lb-private
  configuration:
    # Gateway owns the complete remote ingress program for this tunnel.
    mode: Gateway
  managementPolicy: Managed
  deletionPolicy: Delete
  dns:
    mode: External
  listeners:
  - name: admin-private
    exposure: Private
    hostnameRoute:
      create: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cc-lb
  namespace: llm-proxy
spec:
  gatewayClassName: flareway
  infrastructure:
    parametersRef:
      group: flareway.bhyoo.com
      kind: CloudflareTunnel
      name: cc-lb
  listeners:
  - name: admin-private
    hostname: admin.cc-lb.internal
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: cc-lb-private-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cc-lb-private
  namespace: llm-proxy
spec:
  parentRefs:
  - name: cc-lb
    sectionName: admin-private
  hostnames:
  - admin.cc-lb.internal
  rules:
  - backendRefs:
    - name: cc-lb
      port: 9090
