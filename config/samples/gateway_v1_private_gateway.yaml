# A private listener needs a VirtualNetwork in its own namespace, and only a
# namespace whose grant sets platformObjects: Allowed can manage one. The private
# Gateway therefore lives in flareway-platform, created by
# flareway_v1alpha1_cloudflareaccount.yaml.
apiVersion: flareway.bhyoo.com/v1alpha1
kind: CloudflareTunnel
metadata:
  name: private-gateway
  namespace: flareway-platform
spec:
  accountRef:
    name: example-account
  tunnel:
    name: flareway-example-private-gateway
  configuration:
    # Gateway owns the complete remote ingress program for this tunnel.
    mode: Gateway
  managementPolicy: Managed
  deletionPolicy: Delete
  dns:
    mode: External
  listeners:
  - name: admin-private
    exposure: Private
    virtualNetworkRef:
      name: private-services
    hostnameRoute:
      create: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway
  namespace: flareway-platform
spec:
  gatewayClassName: flareway
  infrastructure:
    parametersRef:
      group: flareway.bhyoo.com
      kind: CloudflareTunnel
      name: private-gateway
  listeners:
  - name: admin-private
    hostname: admin.internal.example
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: admin-internal-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: private-admin
  namespace: flareway-platform
spec:
  parentRefs:
  - name: private-gateway
    sectionName: admin-private
  hostnames:
  - admin.internal.example
  rules:
  - backendRefs:
    - name: demo-admin
      port: 9090
