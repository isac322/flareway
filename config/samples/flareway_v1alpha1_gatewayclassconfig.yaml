apiVersion: flareway.bhyoo.com/v1alpha1
kind: GatewayClassConfig
metadata:
  name: default
spec:
  accountRef:
    name: example-account
  connector:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    replicas: 2
    protocol: Auto
    gracePeriod: 60s
  proxy:
    image: envoyproxy/envoy:distroless-v1.40.0
    streamIdleTimeout: 1h
    concurrency: 1
  privateDNS:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
  dns:
    mode: Managed
  originJWT:
    mode: Required
  conformanceMode: false
  conformance:
    serviceType: LoadBalancer
