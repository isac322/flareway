apiVersion: flareway.bhyoo.com/v1alpha1
kind: GatewayClassConfig
metadata:
  name: default
spec:
  accountRef:
    name: example-account
  connector:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    replicas: 2
    protocol: Auto
    gracePeriod: 60s
  proxy:
    image: envoyproxy/envoy:distroless-v1.40.0
    streamIdleTimeout: 1h
    concurrency: 1
  privateDNS:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
  dns:
    mode: Managed
  originJWT:
    mode: Required
  conformanceMode: false
  conformance:
    serviceType: LoadBalancer
