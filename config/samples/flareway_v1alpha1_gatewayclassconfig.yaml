apiVersion: flareway.bhyoo.com/v1alpha1
kind: GatewayClassConfig
metadata:
  name: default
spec:
  accountRef:
    name: example-account
  connector:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    replicas: 2
    protocol: Auto
    gracePeriod: 60s
  proxy:
    image: envoyproxy/envoy:distroless-v1.40.2
    streamIdleTimeout: 1h
    concurrency: 1
  privateDNS:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
  dns:
    mode: Managed
  originJWT:
    mode: Required
  conformanceMode: false
  conformance:
    serviceType: LoadBalancer
