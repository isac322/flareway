# Gateway-attached Access application variants. Object references and remote IDs
# are examples; replace them before applying these manifests.
# Access policies and the custom page are shared objects in flareway-platform;
# the default namespace grant permits these cross-namespace references.
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessApplication
metadata:
  name: demo-admin
  namespace: default
spec:
  accountRef:
    name: example-account
  type: SelfHosted
  selfHosted: {}
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    sectionName: web
  application:
    name: Demo application
    sessionDuration: 720h
    allowAuthenticateViaWarp: true
    autoRedirectToIdentity: true
    allowedIdpRefs:
    # IdentityProvider objects resolve only in the application namespace;
    # reference the shared provider in flareway-platform by its Cloudflare ID.
    - externalId: "00000000-0000-0000-0000-000000000001"
    appLauncherVisible: true
    customPageRefs:
    - objectRef:
        name: accesscustompage-sample
        namespace: flareway-platform
    tags:
    - example
    - admin
  policies:
  - policyRef:
      name: allow-developers-warp
      namespace: flareway-platform
  - policyRef:
      name: deny-everyone
      namespace: flareway-platform
  originJWT:
    mode: Required
    audienceScope: Application
  managementPolicy: Managed
  deletionPolicy: Delete
---
