---
# Two Access applications share one hostname. Hostname audience scope makes the
# origin accept every ready AUD compiled for analytics.example.com; no AUD or
# application ID is embedded in the manifests.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: analytics
  namespace: default
spec:
  gatewayClassName: flareway
  listeners:
  - name: http
    hostname: analytics.example.com
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: analytics
  namespace: default
spec:
  parentRefs:
  - name: analytics
    sectionName: http
  hostnames:
  - analytics.example.com
  rules:
  - name: analytics
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: analytics
      port: 5000
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessApplication
metadata:
  name: analytics-ui
  namespace: default
spec:
  accountRef:
    name: example-account
  type: SelfHosted
  selfHosted: {}
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: analytics
    sectionName: http
  application:
    name: Analytics UI
    sessionDuration: 8h
  policies:
  - policyRef:
      name: allow-developers-warp
      namespace: flareway-platform
  originJWT:
    mode: Required
    audienceScope: Hostname
  managementPolicy: Managed
  deletionPolicy: Delete
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessApplication
metadata:
  name: analytics-reports
  namespace: default
spec:
  accountRef:
    name: example-account
  type: SelfHosted
  selfHosted: {}
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: analytics
    sectionName: analytics
  pathScope:
    type: PathPrefix
    value: /api/reports
  application:
    name: Analytics reports API
    sessionDuration: 1h
  policies:
  - policyRef:
      name: allow-reporting-service
      namespace: flareway-platform
  originJWT:
    mode: Required
    audienceScope: Hostname
  managementPolicy: Managed
  deletionPolicy: Delete
