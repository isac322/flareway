---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessApplication
metadata:
  name: mcp-server-sample
  namespace: default
spec:
  accountRef:
    name: example-account
  type: MCP
  mcp: {}
  destinations:
  - type: ViaMCPServerPortal
    viaMcpServerPortal:
      mcpServerId: replace-with-mcp-server-id
  application:
    name: MCP server
    sessionDuration: 8h
    allowedIdpRefs:
    # IdentityProvider objects resolve only in the application namespace;
    # reference the shared provider in flareway-platform by its Cloudflare ID.
    - externalId: "00000000-0000-0000-0000-000000000001"
    customPageRefs:
    - objectRef:
        name: accesscustompage-sample
        namespace: flareway-platform
    oauthConfiguration:
      enabled: true
      dynamicClientRegistration:
        enabled: true
        allowAnyOnLocalhost: false
        allowAnyOnLoopback: true
        allowedUris:
        - https://mcp-client.example.com/callback
      grant:
        accessTokenLifetime: 1h
        sessionDuration: 8h
  policies:
  - policyRef:
      name: allow-developers-warp
      namespace: flareway-platform
  originJWT:
    mode: Required
  managementPolicy: Managed
  deletionPolicy: Delete
