---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessStandaloneApplication
metadata:
  name: mcp-portal-sample
  namespace: default
spec:
  accountRef:
    name: example
  type: MCPPortal
  application:
    name: MCP portal
    sessionDuration: 8h
    allowedIdpRefs:
    - name: google
    customPageRefs:
    - objectRef:
        name: accesscustompage-sample
  policies:
  - policyRef:
      name: allow-developers-warp
  mcpPortal:
    domain: mcp.example.com
    destinations:
    - type: ViaMCPServerPortal
      viaMcpServerPortal:
        mcpServerId: replace-with-mcp-server-id
    - type: Worker
      worker:
        workerId: replace-with-production-worker-id
    - type: PreviewWorker
      previewWorker:
        workerId: replace-with-preview-worker-id
    - type: AllWorkers
      allWorkers: {}
    - type: AllPreviewWorkers
      allPreviewWorkers: {}
  managementPolicy: Managed
  deletionPolicy: Orphan
