apiVersion: flareway.bhyoo.com/v1alpha1
kind: ServiceToken
metadata:
  name: automation
  namespace: default
spec:
  accountRef:
    name: example-account
  name: flareway/default/automation
  enabled: true
  duration: 8760h
  secretRef:
    name: automation-access-token
  rotation:
    mode: Manual
    graceDuration: 24h
  managementPolicy: Managed
  deletionPolicy: Delete
