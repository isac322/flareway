apiVersion: flareway.bhyoo.com/v1alpha1
kind: AccessGroup
metadata:
  name: developers
  namespace: flareway-platform
spec:
  accountRef:
    name: example-account
  name: developers
  include:
  - emailDomain:
      domain: example.com
  managementPolicy: ObserveOnly
  externalRef:
    groupId: "00000000-0000-0000-0000-000000000002"
  deletionPolicy: Orphan
