apiVersion: flareway.bhyoo.com/v1alpha1
kind: HostnameRoute
metadata:
  name: private-admin
  namespace: flareway-platform
  labels:
    flareway.bhyoo.com/private-route: platform
spec:
  accountRef:
    name: example-account
  hostname: admin.internal.example
  tunnelRef:
    kind: CloudflareTunnel
    name: private-gateway
    namespace: flareway-platform
  allowedNamespaces:
    from: Same
  comment: Private admin hostname through the Gateway tunnel
  managementPolicy: Managed
  deletionPolicy: Delete
---
apiVersion: flareway.bhyoo.com/v1alpha1
kind: HostnameRoute
metadata:
  name: branch-dns
  namespace: flareway-platform
  labels:
    flareway.bhyoo.com/private-route: platform
spec:
  accountRef:
    name: example-account
  hostname: printer.internal.example
  tunnelRef:
    kind: WARPConnector
    name: branch-local
    namespace: flareway-platform
  allowedNamespaces:
    from: Same
  comment: Private DNS hostname through the local-HA WARP Connector
  managementPolicy: Managed
  deletionPolicy: Delete
