name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-diff:
    name: Generation diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache
      - name: Verify generated files
        run: make verify-generated

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache
      - name: Lint
        run: make lint

  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache
      - name: Test
        run: make test
      - name: Compile exploratory harness
        run: make test-exploratory-compile

  test-envoy:
    name: Envoy component tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache
      - name: Test Envoy integration
        run: make test-envoy

  artifacts:
    name: Schema, build, Helm, and Kustomize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache
      - name: Verify artifacts
        run: make verify-artifacts

  container:
    name: Container build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify container
        run: make verify-container IMG=flareway:ci
