name: Cloudflare end-to-end janitor

on:
  schedule:
    - cron: "30 19 * * *" # 04:30 KST
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cloudflare end-to-end tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: cloudflare-e2e-janitor
  cancel-in-progress: false

jobs:
  janitor:
    name: Remove stale end-to-end resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Remove stale resources
        env:
          FLAREWAY_E2E_CF_API_TOKEN: ${{ secrets.FLAREWAY_E2E_CF_API_TOKEN }}
          FLAREWAY_E2E_CF_ACCOUNT_ID: ${{ secrets.FLAREWAY_E2E_CF_ACCOUNT_ID }}
          FLAREWAY_E2E_ZONE: ${{ secrets.FLAREWAY_E2E_ZONE }}
        run: make e2e-janitor
