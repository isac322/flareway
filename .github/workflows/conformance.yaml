name: Gateway API conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_CLUSTER_NAME: flareway-conf
  KIND_NODE_IMAGE: kindest/node:v1.35.0
  GATEWAY_API_VERSION: v1.6.2
  KIND_VERSION: v0.33.0
  CLOUD_PROVIDER_KIND_VERSION: v0.11.1
  KO_VERSION: v0.19.1
  KUSTOMIZE_VERSION: v5.8.1

jobs:
  conformance:
    name: GatewayHTTP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run portable conformance workflow
        env:
          LOCALBIN: ${{ runner.temp }}/bin
          REPORT_OUTPUT: ${{ github.workspace }}/conformance/reports/v1.6.2/flareway/standard-${{ github.sha }}-default-report.yaml
          VERSION: ${{ github.sha }}
        run: hack/run-conformance.sh

      - name: Upload conformance report and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-api-conformance-${{ github.sha }}
          path: |
            conformance/reports/v1.6.2/flareway/
            artifacts/conformance/
          if-no-files-found: error
          retention-days: 14
