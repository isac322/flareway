name: Gateway API conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_CLUSTER_NAME: flareway-conf
  KIND_NODE_IMAGE: kindest/node:v1.37.0
  GATEWAY_API_VERSION: v1.6.3
  KIND_VERSION: v0.33.0
  CLOUD_PROVIDER_KIND_VERSION: v0.12.0
  KO_VERSION: v0.19.1
  KUSTOMIZE_VERSION: v5.8.3

jobs:
  conformance:
    name: GatewayHTTP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and restore the shared build cache
        uses: ./.github/actions/go-cache

      - name: Run portable conformance workflow
        env:
          LOCALBIN: ${{ runner.temp }}/bin
          REPORT_OUTPUT: ${{ github.workspace }}/docs/conformance/v1.6.3/flareway/standard-${{ github.sha }}-default-report.yaml
          VERSION: ${{ github.sha }}
        run: hack/run-conformance.sh

      - name: Upload conformance report and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-api-conformance-${{ github.sha }}
          path: |
            docs/conformance/v1.6.3/flareway/
            artifacts/conformance/
          if-no-files-found: error
          retention-days: 14
