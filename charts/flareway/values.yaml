# Flareway uses a fixed system namespace because xDS certificates and data-plane
# bootstrap configuration address flareway-system directly.
namespace:
  create: false
  name: flareway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    helm.sh/resource-policy: keep

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/isac322/flareway
  # The chart appVersion is used when tag is empty.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Go runtime controls for the controller manager.
goRuntime:
  GOMEMLIMIT: 115MiB
  GODEBUG: tracebacklabels=0

# Controller-manager logging. Each value maps to one --zap-* flag.
logging:
  # --zap-devel: development mode (enables DPanic panics and disables sampling).
  development: false
  # --zap-log-level: debug, info, error, panic, or an integer 1-6 for logr V(N).
  level: info
  # --zap-encoder: json or console.
  encoder: json

# Each value controls one controller-manager feature flag. All groups remain
# enabled by default. The shared CloudflareAccount controller runs whenever any
# controller group is enabled.
controllers:
  # GatewayClass, Gateway, and CloudflareTunnel.
  gateway: true
  # AccessApplication, AccessStandaloneApplication,
  # AccessInfrastructureTarget, AccessCustomPage, AccessPolicy, AccessGroup,
  # IdentityProvider, DevicePostureRule, DevicePostureIntegration, and
  # ServiceToken.
  access: true
  # VirtualNetwork, NetworkRoute, HostnameRoute, and WARPConnector.
  privateNetwork: true
  # DeviceProfile and DeviceSettings.
  device: true
  # ZeroTrustOrganization, ZeroTrustGatewayPolicy, and ZeroTrustList.
  organization: true

leaderElection:
  enabled: true

metrics:
  enabled: true
  secure: true
  service:
    type: ClusterIP
    port: 8443
    annotations: {}

xds:
  service:
    type: ClusterIP
    port: 18000
    annotations: {}

networkPolicy:
  enabled: true
  metrics:
    namespaceSelector:
      matchLabels:
        metrics: enabled
  xds:
    namespaceSelector: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 10

# Flareway CRDs are bundled in crds/ and retained by Helm on uninstall.
# Gateway API CRDs are a separate installation prerequisite and are not bundled.
gatewayClass:
  create: false
  name: flareway
  configName: default
  config:
    # Set this to the name of a cluster-scoped CloudflareAccount for Cloudflare mode.
    accountRefName: ""
    conformanceMode: false
    connector:
      image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
      replicas: 2
      protocol: Auto
      gracePeriod: 60s
      resources: {}
    proxy:
      image: envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
      concurrency: 1
      streamIdleTimeout: 1h
      resources: {}
    privateDNS:
      image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
      resources: {}
    dns:
      mode: Managed
    originJWT:
      mode: Required
    conformance:
      serviceType: LoadBalancer
