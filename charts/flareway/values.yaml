# Flareway uses a fixed system namespace because xDS certificates and data-plane
# bootstrap configuration address flareway-system directly.
namespace:
  create: false
  name: flareway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    helm.sh/resource-policy: keep

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/isac322/flareway
  # The chart appVersion is used when tag is empty.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Go runtime controls for the controller manager.
goRuntime:
  GOMEMLIMIT: 115MiB
  GODEBUG: tracebacklabels=0

# Controller-manager logging. Each value maps to one --zap-* flag.
logging:
  # --zap-devel: development mode (enables DPanic panics and disables sampling).
  development: false
  # --zap-log-level: debug, info, error, panic, or an integer 1-6 for logr V(N).
  level: info
  # --zap-encoder: json or console.
  encoder: json

# Drift handling and Cloudflare read freshness. Each value maps to one
# controller-manager flag; the defaults match the manager's built-in defaults.
reconcile:
  # --drift-policy: Overwrite restores the desired state over out-of-band
  # changes; Hold skips the remote write until the spec changes or the remote
  # is repaired.
  driftPolicy: Overwrite
  # How long a converged object skips Cloudflare reads, per freshness grade.
  # 0s keeps the gate closed, so every pass reads Cloudflare. Positive values
  # must satisfy authz <= traffic <= indirect.
  freshness:
    # --freshness-authz: T1 kinds such as AccessApplication and AccessPolicy.
    authz: 60s
    # --freshness-traffic: T2 kinds such as CloudflareTunnel and DNS records.
    traffic: 300s
    # --freshness-indirect: T3 kinds such as DeviceProfile and WARPConnector.
    indirect: 1800s
    # --freshness-display: T4 display-only reads. No Flareway kind uses T4.
    display: 0s
  # --disable-sweep: stop the periodic drift sweep worker.
  disableSweep: false

# Each value controls one controller-manager feature flag. All groups remain
# enabled by default. The shared CloudflareAccount controller runs whenever any
# controller group is enabled.
controllers:
  # GatewayClass, Gateway, and CloudflareTunnel.
  gateway: true
  # AccessApplication, AccessStandaloneApplication,
  # AccessInfrastructureTarget, AccessCustomPage, AccessPolicy, AccessGroup,
  # IdentityProvider, DevicePostureRule, DevicePostureIntegration, and
  # ServiceToken.
  access: true
  # VirtualNetwork, NetworkRoute, HostnameRoute, and WARPConnector.
  privateNetwork: true
  # DeviceProfile and DeviceSettings.
  device: true
  # ZeroTrustOrganization, ZeroTrustGatewayPolicy, and ZeroTrustList.
  organization: true

leaderElection:
  enabled: true

metrics:
  enabled: true
  secure: true
  service:
    type: ClusterIP
    port: 8443
    annotations: {}

xds:
  service:
    type: ClusterIP
    port: 18000
    annotations: {}

networkPolicy:
  enabled: true
  metrics:
    namespaceSelector:
      matchLabels:
        metrics: enabled
  xds:
    namespaceSelector: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 10

# Flareway CRDs are bundled in crds/ and retained by Helm on uninstall.
# Gateway API CRDs are a separate installation prerequisite and are not bundled.
gatewayClass:
  create: false
  name: flareway
  configName: default
  config:
    # Set this to the name of a cluster-scoped CloudflareAccount for Cloudflare mode.
    accountRefName: ""
    conformanceMode: false
    connector:
      image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
      replicas: 2
      protocol: Auto
      gracePeriod: 60s
      resources: {}
    proxy:
      image: envoyproxy/envoy:distroless-v1.39.3@sha256:7369b033550a14997e5d698677b7b51f0210a80754f5d084c5caa1a78268267b
      concurrency: 1
      streamIdleTimeout: 1h
      resources: {}
    privateDNS:
      image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
      resources: {}
    dns:
      mode: Managed
    originJWT:
      mode: Required
    conformance:
      serviceType: LoadBalancer
    # Places the dataplane pods of Gateways in this class. The top-level
    # nodeSelector, tolerations, affinity, and topologySpreadConstraints
    # values place only the controller-manager pod.
    scheduling: {}
