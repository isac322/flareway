  name: identityproviders.flareway.bhyoo.com
spec:
  group: flareway.bhyoo.com
  names:
    categories:
    - flareway
    kind: IdentityProvider
    listKind: IdentityProviderList
    plural: identityproviders
    shortNames:
    - cfidp
    singular: identityprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.idpId
      name: IdP
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IdentityProvider is a namespaced Cloudflare Access identity provider.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
