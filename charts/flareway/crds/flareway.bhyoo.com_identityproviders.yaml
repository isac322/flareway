                    - login
                    - select_account
                    - none
                    type: string
                  restrictToAccountMembers:
                    type: boolean
                  scopes:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  signRequest:
                    type: boolean
                  ssoTargetUrl:
                    type: string
                  supportGroups:
                    type: boolean
                  tokenUrl:
                    type: string
