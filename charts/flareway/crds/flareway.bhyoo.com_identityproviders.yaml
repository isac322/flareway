                    type: object
                  conditionalAccessEnabled:
                    type: boolean
                  directoryId:
                    type: string
                  emailAttributeName:
                    type: string
                  emailClaimName:
                    type: string
                  enableEncryption:
                    type: boolean
                  forceAuthn:
                    type: boolean
