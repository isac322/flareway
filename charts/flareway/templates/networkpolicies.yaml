{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flareway.fullname" . }}-allow-health
  namespace: {{ include "flareway.namespace" . }}
  labels:
    {{- include "flareway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flareway.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8081
          protocol: TCP
{{- if .Values.controllers.gateway }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flareway.fullname" . }}-allow-xds
  namespace: {{ include "flareway.namespace" . }}
  labels:
    {{- include "flareway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flareway.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.xds.namespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.xds.service.port }}
          protocol: TCP
{{- end }}
{{- if .Values.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flareway.fullname" . }}-allow-metrics
  namespace: {{ include "flareway.namespace" . }}
  labels:
    {{- include "flareway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flareway.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metrics.namespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.metrics.service.port }}
          protocol: TCP
{{- end }}
{{- end }}
